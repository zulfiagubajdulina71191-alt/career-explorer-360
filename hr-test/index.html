const KEY='layer_anon_test_v2',D={1:900,2:720,3:600,4:420},STATUS=[['','Выберите статус'],['P','ПОДТВЕРЖДЕНО'],['N','НЕ ПОДТВЕРЖДЕНО'],['D','НЕДОСТАТОЧНО ДАННЫХ'],['U','ТРЕБУЕТСЯ УТОЧНЕНИЕ']],ROWS=[{id:'A-071',dl:'05.07',reg:'Закрыто 05.07',ans:'Ответ № 288 от 04.07',proof:'Есть, 04.07',att:'2 из 2',note:'Нет'},{id:'A-072',dl:'10.07',reg:'Закрыто 11.07',ans:'Ответ № 294 от 11.07',proof:'Есть, 11.07',att:'1 из 1',note:'Нет'},{id:'A-073',dl:'30.06',reg:'Закрыто 30.06',ans:'Ответ № 271 от 30.06',proof:'Есть, 30.06',att:'1 из 1',note:'Нет'},{id:'A-074',dl:'14.07',reg:'Закрыто 14.07',ans:'Файл ответа № 301 от 14.07',proof:'Подтверждение отправки отсутствует',att:'1 из 1',note:'Нет'},{id:'A-075',dl:'18.07',reg:'Закрыто 18.07',ans:'В карточке: отправлен 17.07',proof:'Почтовый отчёт: отправлен 19.07',att:'2 из 2',note:'Да, даты расходятся'},{id:'A-076',dl:'23.07',reg:'Закрыто 22.07',ans:'Ответ № 312 от 22.07',proof:'Есть, 22.07',att:'3 из 3',note:'Нет'},{id:'A-077',dl:'23.07',reg:'Закрыто 22.07',ans:'Ответ № 312 от 22.07',proof:'Есть, 22.07',att:'3 из 3',note:'Совпадает клиент, тема и № ответа с A-076'},{id:'A-078',dl:'26.07',reg:'Закрыто 25.07',ans:'Ответ № 319 от 25.07',proof:'Есть, 25.07',att:'В ответе указано 2 приложения, в карточке 1',note:'Нет'},{id:'A-079',dl:'29.07',reg:'Закрыто 29.07',ans:'Финального письма нет. Комментарий: «объяснил клиенту по телефону»',proof:'Нет',att:'0',note:'Нет'},{id:'A-080',dl:'31.07',reg:'Закрыто 31.07',ans:'Ответ № 327 от 31.07',proof:'Есть, 31.07, адресат из журнала отправки',att:'1 из 1',note:'В карточке указан другой адресат'}],K={'A-071':['P',['срок','отправ','прилож']], 'A-072':['N',['11.07','10.07','проср']], 'A-073':['N',['30.06','вне','период']], 'A-074':['D',['подтверж','отправ','отсутств']], 'A-075':['U',['дат','расход','почтов','противореч','первич']], 'A-076':['P',['срок','отправ','прилож']], 'A-077':['N',['дуб','a-076','совпад']], 'A-078':['D',['прилож','отсутств','2','1']], 'A-079':['N',['письмен','телефон','нет']], 'A-080':['U',['адрес','не совп','уточн','относ']]},COMPS=[['control','Контрольное мышление и доказательность',1],['registration','Регистрационная дисциплина и внимательность',1],['cycle','Полный цикл претензионной / проблемной работы',1],['tasks','Постановка конкретных задач',1],['follow','Доведение до результата и эскалация',1],['priority','Приоритизация и управление риском',1],['system','Анализ повторяемости и системных причин',1],['analytics','Краткая управленческая аналитика',1],['writing','Письменная деловая коммуникация',0]];
const app=document.getElementById('app'),meta=document.getElementById('meta'),bar=document.getElementById('bar'),prog=document.getElementById('progText'),timer=document.getElementById('timer'),time=document.getElementById('timeText'),toast=document.getElementById('toast');let tickId=null;
function fresh(){return{started:false,done:false,block:0,end:null,masked:false,answers:{b1:{reg:'',ess:'',dem:'',dl:'',risk:'',facts:'',conf:'',miss:'',tasks:[{role:'',result:'',deadline:'',proof:''},{role:'',result:'',deadline:'',proof:''},{role:'',result:'',deadline:'',proof:''}],plan:''},b2:Object.fromEntries(ROWS.map(r=>[r.id,{status:'',reason:''}])),b3:{rep:'',con:'',mea:''},b4:{first:'',day:'',cri:'',mgr:'',esc:''}}}}function load(){try{return JSON.parse(sessionStorage.getItem(KEY))||fresh()}catch{return fresh()}}let s=load();function save(){sessionStorage.setItem(KEY,JSON.stringify(s))}const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),nl=v=>esc(v||'—').replace(/\n/g,'<br>'),n=v=>String(v||'').toLowerCase().replaceAll('ё','е').replace(/\s+/g,' ').trim(),has=(t,a)=>a.some(x=>n(t).includes(n(x))),hits=(t,a)=>a.reduce((z,x)=>z+(n(t).includes(n(x))?1:0),0),r1=x=>Math.round(x*10)/10,val=id=>document.getElementById(id)?.value.trim()||'';function show(x){toast.textContent=x;toast.classList.add('show');clearTimeout(toast._);toast._=setTimeout(()=>toast.classList.remove('show'),2300)}function format(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function setEnd(){s.end=Date.now()+D[s.block]*1000}function clock(){clearInterval(tickId);if(!s.started||s.done)return;go();tickId=setInterval(go,1000)}function go(){let left=Math.ceil((s.end-Date.now())/1000);time.textContent=s.masked?'••:••':format(left);timer.classList.toggle('warn',left<=180&&left>60);timer.classList.toggle('danger',left<=60);if(left<=0){clearInterval(tickId);next(true)}}timer.onclick=()=>{s.masked=!s.masked;save();go()};window.addEventListener('beforeunload',e=>{if(s.started&&!s.done){e.preventDefault();e.returnValue=''}});let autos;window.addEventListener('input',()=>{if(!s.started||s.done)return;clearTimeout(autos);autos=setTimeout(()=>{collect();save()},250)});window.addEventListener('change',()=>{if(s.started&&!s.done){collect();save()}});
function route(){clearInterval(tickId);if(!s.started){meta.classList.add('hidden');start();return}if(s.done){meta.classList.add('hidden');finishScreen();return}meta.classList.remove('hidden');bar.style.width=s.block*25+'%';prog.textContent='Блок '+s.block+' из 4';render();clock()}
function start(){app.innerHTML=`<section class="hero"><div class="eyebrow">Профессиональная оценка</div><h1>Специалист по операционному контролю и качеству</h1><p class="lead">Анонимный практический тест. Сайт не запрашивает ФИО, email, телефон и другие персональные данные.</p><div class="info"><div class="ibox"><strong>44 минуты</strong><span>4 последовательных блока</span></div><div class="ibox"><strong>Без регистрации</strong><span>Никакие данные кандидата не вводятся</span></div><div class="ibox"><strong>Рабочие ситуации</strong><span>Проверяются факты, сроки, задачи, доказательства и приоритеты</span></div></div><div class="card soft"><h3>Правила</h3><ul class="rules"><li>Лимиты блоков: 15, 12, 10 и 7 минут.</li><li>После сдачи блока вернуться назад нельзя.</li><li>Прогресс временно сохраняется только в текущей вкладке браузера.</li><li>Если данных недостаточно, так и укажите и назовите, чего не хватает.</li><li>Во внутренних задачах указывайте результат, срок и подтверждение.</li></ul></div><label class="check"><input id="ack" type="checkbox"><span>Я прочитал(а) правила и готов(а) начать тест.</span></label><div class="btnrow"><button id="begin" class="btn primary">Начать тест</button></div></section>`;document.getElementById('begin').onclick=()=>{if(!document.getElementById('ack').checked)return show('Подтвердите, что правила прочитаны.');s=fresh();s.started=true;s.block=1;setEnd();save();route()}}
const ta=(id,l,v)=>`<div class="field"><label>${l}</label><textarea id="${id}">${esc(v)}</textarea></div>`;function shell(i,t,sub,body){return`<section><div class="blockhead"><div class="eyebrow">Блок ${i} из 4</div><h2>${t}</h2><p>${sub}</p></div>${body}<div class="btnrow"><button id="next" class="btn primary">${i===4?'Завершить тест':'Завершить блок и перейти дальше'}</button></div></section>`}

function b1(){let a=s.answers.b1;app.innerHTML=shell(1,'Work Sample: разбор входящего официального письма','15 минут. Вы отвечаете за регистрацию, разбор и движение обращения до ответа клиенту.',`<div class="card"><div class="letter"><div>Компания-клиент<br>Исх. № 418/26 от 18.08.2026<br>В ООО «Лайер»</div><div class="center">О расхождении комплектации, состоянии элементов и сроках предоставления документов по производственному объекту</div><p>В рамках договора аренды и проектного сопровождения № Л-127/26 от 12.05.2026 15.08.2026 была принята очередная партия элементов строительных лесов по УПД № 827 от 14.08.2026.</p><p>При разгрузке и подготовке к монтажу выявлено расхождение: отсутствуют <strong>14 стальных настилов длиной 2,57 м и 8 бортовых досок</strong>. Просим проверить данные отгрузки и подтвердить срок довоза.</p><p>По <strong>6 диагональным элементам</strong> обнаружена видимая деформация. До получения письменного заключения элементы выведены из использования. Просим подтвердить возможность дальнейшего применения либо организовать замену. Фотографии приложены.</p><p>Также не получены копии сертификатов/паспортов и подписанный складом комплектовочный лист к УПД № 827.</p><p><strong>Просим:</strong></p><ol><li>До <strong>20.08.2026 16:00</strong> направить документы.</li><li>До <strong>21.08.2026 12:00</strong> предоставить письменный ответ по причинам расхождения, фактическому количеству и результату проверки 6 диагональных элементов.</li><li>Не позднее <strong>22.08.2026</strong> обеспечить поставку подтвержденного недостающего количества и при необходимости замену.</li></ol><p>Приемка транспорта осуществляется с 09:00 до 15:00, пропуска оформляются минимум за один рабочий день. При нарушении сроков клиент оставляет право предъявить документально подтвержденные расходы, связанные с простоем.</p><p><strong>Приложения:</strong></p><ol><li>Акт расхождений № 17/08-2: указано <strong>12 настилов 2,57 м</strong>, 8 бортовых досок и 6 диагональных элементов с деформацией. Подписан только представителем клиента.</li><li>Фототаблица: 5 фото. Маркировка элементов не читается, масштаб отсутствует.</li><li>УПД № 827: 120 настилов 2,57 м и 40 бортовых досок. Комплектовочный лист и сертификаты не приложены.</li></ol><div class="sig">Коммерческий директор клиента</div></div></div><div class="card"><h3>1.1. Карточка регистрации</h3><p class="muted">Перечислите обязательные поля для регистрации и последующего контроля письма.</p><textarea id="reg">${esc(a.reg)}</textarea></div><div class="card"><h3>1.2. Разбор содержания</h3>${ta('ess','Краткая суть обращения',a.ess)}${ta('dem','Требования клиента',a.dem)}${ta('dl','Внешние сроки',a.dl)}${ta('risk','Ключевые риски',a.risk)}${ta('facts','Какие факты уже подтверждены материалами',a.facts)}${ta('conf','Какие факты противоречат друг другу',a.conf)}${ta('miss','Каких данных не хватает для вывода',a.miss)}</div><div class="card"><h3>1.3. Участники и внутренние задачи</h3><p class="muted">Сформулируйте 2-3 задачи: конкретный результат, внутренний срок и подтверждение.</p><div class="tablewrap"><table><thead><tr><th>Кому / роль</th><th>Что должно быть получено</th><th>Внутренний срок</th><th>Подтверждение результата</th></tr></thead><tbody>${a.tasks.map((t,i)=>`<tr><td><textarea class="smallarea" id="r${i}">${esc(t.role)}</textarea></td><td><textarea class="smallarea" id="x${i}">${esc(t.result)}</textarea></td><td><textarea class="smallarea" id="d${i}">${esc(t.deadline)}</textarea></td><td><textarea class="smallarea" id="p${i}">${esc(t.proof)}</textarea></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>1.4. План контроля до ответа клиенту</h3><textarea id="plan" style="min-height:170px">${esc(a.plan)}</textarea></div>`)}
function b2(){let a=s.answers.b2;app.innerHTML=shell(2,'Work Sample: проверка исполнения по правилу','12 минут. Применяйте одно и то же правило ко всем строкам.',`<div class="rule"><p><strong>Правило контроля</strong></p><p>Проверяем только обращения, у которых внешний срок ответа находится в периоде 01.07.2026-31.07.2026.</p><p>«ПОДТВЕРЖДЕНО» - только если финальный письменный ответ отправлен не позднее внешнего срока, есть подтверждение отправки и все перечисленные приложения присутствуют.</p><p>Прямой пропуск срока, отсутствие финального письменного ответа, нахождение вне периода или явный дубль - «НЕ ПОДТВЕРЖДЕНО».</p><p>Нет обязательного подтверждения, но источники не конфликтуют - «НЕДОСТАТОЧНО ДАННЫХ».</p><p>Источники противоречат друг другу или доказательство неясно относится к обращению/адресату - «ТРЕБУЕТСЯ УТОЧНЕНИЕ».</p><p><strong>Статус «закрыто» сам по себе не является доказательством.</strong></p></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Внешний срок</th><th>Статус в реестре</th><th>Финальный ответ</th><th>Подтверждение отправки</th><th>Приложения</th><th>Особенность источников</th><th>Ваш статус + обоснование</th></tr></thead><tbody>${ROWS.map(r=>`<tr><td class="rowid">${r.id}</td><td>${r.dl}</td><td>${r.reg}</td><td>${r.ans}</td><td>${r.proof}</td><td>${r.att}</td><td>${r.note}</td><td><select id="s${r.id}">${STATUS.map(([v,l])=>`<option value="${v}" ${a[r.id].status===v?'selected':''}>${l}</option>`).join('')}</select><textarea class="smallarea" id="q${r.id}" placeholder="Краткое основание">${esc(a[r.id].reason)}</textarea></td></tr>`).join('')}</tbody></table></div>`)}

function lvl(q){return q>=.88?5:q>=.72?4:q>=.52?3:q>=.32?2:1}function scoring(){let a=s.answers,b1=sb1(a.b1),b2=sb2(a.b2),b3=sb3(a.b3),b4=sb4(a.b4),total=r1(b1.total+b2.total+b3.total+b4.total),c={control:lvl((b1.facts/10)*.3+(b2.total/25)*.5+(b3.ev/5)*.2),registration:lvl((b1.reg/8)*.5+(b2.total/25)*.5),cycle:lvl((b1.control/10)*.65+(b4.first/5)*.35),tasks:lvl((b1.tasks/12)*.72+(b4.first/5)*.28),follow:lvl((b1.control/10)*.55+(b4.es/3)*.45),priority:lvl((b4.pri/4)*.72+(b4.first/5)*.28),system:lvl(b3.total/20),analytics:lvl(((b3.con+b3.mea)/9)*.72+(b4.comm/3)*.28),writing:JSON.stringify(a).length>2200?4:JSON.stringify(a).length>1200?3:2},fl=[],add=(sev,text)=>fl.push({sev,text});if(b1.tasks<4)add('stop','Задачи в блоке 1 в основном не содержат одновременно конкретный результат, внутренний срок и подтверждение.');if(!has(a.b1.conf,['14'])||!has(a.b1.conf,['12']))add('warn','Не выделено противоречие 14 настилов в письме против 12 в акте.');if(!has(a.b1.plan,['эскал']))add('warn','В плане контроля не обнаружена явная ранняя эскалация.');let risky=['A-074','A-075','A-078','A-080'].filter(id=>a.b2[id].status==='P');if(risky.length>=2)add('stop','Несколько спорных результатов засчитаны как подтверждённые при проблемах с доказательствами: '+risky.join(', ')+'.');if(a.b2['A-077'].status==='P')add('warn','A-077 засчитан несмотря на признак дубля A-076.');if(!has(a.b3.rep,['гипотез','не доказ','недостат','провер']))add('warn','Слабо разделены повторяемость и доказанная первопричина.');let k=a.b4.first+' '+a.b4.day+' '+a.b4.mgr;if(has(k,['полный реестр как есть'])&&!has(k,['промежуточ','непровер','маркир','ожида']))add('stop','Есть готовность выдать непроверенный KPI-реестр как финальный результат.');let crit=COMPS.filter(x=>x[2]).map(x=>c[x[0]]),min=Math.min(...crit),stops=fl.filter(x=>x.sev==='stop'),rec='НЕ РЕКОМЕНДОВАТЬ',why='Порог по общему результату или критическим компетенциям не выполнен, либо есть критический риск.';if(!stops.length&&total>=80&&min>=4){rec='РЕКОМЕНДОВАТЬ';why='Предварительно соответствует установленным порогам.'}else if(!stops.length&&total>=75&&min>=3&&crit.filter(x=>x===3).length<=1){rec='РЕКОМЕНДОВАТЬ С ОГОВОРКАМИ';why='Одна критическая зона требует дополнительной проверки.'}return{total,b1,b2,b3,b4,c,fl,rec,why}}
function finishScreen(){app.innerHTML=`<section class="card finish"><div class="ok">✓</div><h1 style="font-size:34px">Тест завершён</h1><p class="lead" style="margin-inline:auto">Спасибо. Передайте устройство интервьюеру.</p><div class="btnrow" style="justify-content:center"><button id="result" class="btn primary">Открыть результат для HR</button><button id="restart" class="btn secondary">Начать новый тест</button></div><p class="small muted" style="margin-top:22px">Сайт не запрашивает и не хранит персональные данные кандидата. Результат относится только к текущему прохождению.</p></section>`;document.getElementById('result').onclick=report;document.getElementById('restart').onclick=()=>{if(confirm('Удалить текущее прохождение и начать новый тест?')){sessionStorage.removeItem(KEY);s=fresh();route()}}}
function sl(v){return STATUS.find(x=>x[0]===v)?.[1]||'—'}function box(k,v){return`<div style="margin:12px 0"><strong>${k}</strong><div class="ans">${nl(v)}</div></div>`}function report(){let sc=scoring(),cls=sc.rec==='РЕКОМЕНДОВАТЬ'?'good':sc.rec.includes('ОГОВОРКАМИ')?'caution':'bad',a=s.answers;app.innerHTML=`<div class="adminbar no-print"><button id="pdf" class="btn primary">Скачать PDF</button><button id="copy" class="btn secondary">Скопировать отчёт</button><button id="new" class="btn secondary">Новый кандидат</button></div><article id="report" class="report"><div class="rhead"><div><div class="eyebrow">ООО «Лайер» · HR-отчёт</div><h1>Практический тест: операционный контроль и качество</h1><div class="muted">Анонимное прохождение</div></div><div><div class="pill ${cls}">${sc.rec}</div><div class="bigscore">${sc.total} / 100</div></div></div><section class="section"><h2>1. Предварительная оценка</h2><div class="info"><div class="ibox"><strong>${sc.b1.total} / 40</strong><span>Блок 1</span></div><div class="ibox"><strong>${sc.b2.total} / 25</strong><span>Блок 2</span></div><div class="ibox"><strong>${sc.b3.total} / 20</strong><span>Блок 3</span></div><div class="ibox"><strong>${sc.b4.total} / 15</strong><span>Блок 4</span></div></div><p><strong>Рекомендация:</strong> ${sc.rec}</p><p class="muted">${sc.why}</p><p class="small muted">Автооценка свободного текста является предварительной. HR должен просмотреть сами ответы перед кадровым решением.</p></section><section class="section"><h2>2. Красные флаги и предупреждения</h2>${sc.fl.length?'<ul class="flags">'+sc.fl.map(f=>'<li><strong>'+(f.sev==='stop'?'СТОП-ФАКТОР':'Проверить')+':</strong> '+esc(f.text)+'</li>').join('')+'</ul>':'<p>Автоматические красные флаги не обнаружены.</p>'}</section><section class="section"><h2>3. Компетенции 1-5</h2><div class="tablewrap"><table><thead><tr><th>Компетенция</th><th>Предварительная оценка</th></tr></thead><tbody>${COMPS.map(c=>`<tr><td>${c[1]}${c[2]?'<span class="small muted"> (критическая)</span>':''}</td><td><strong>${sc.c[c[0]]}</strong></td></tr>`).join('')}</tbody></table></div></section><section class="section"><h2>4. Блок 1: ответы</h2>${box('Карточка регистрации',a.b1.reg)}${box('Краткая суть',a.b1.ess)}${box('Требования клиента',a.b1.dem)}${box('Внешние сроки',a.b1.dl)}${box('Ключевые риски',a.b1.risk)}${box('Подтверждённые факты',a.b1.facts)}${box('Противоречия',a.b1.conf)}${box('Недостающие данные',a.b1.miss)}<h3>Внутренние задачи</h3><div class="tablewrap"><table><thead><tr><th>Роль</th><th>Результат</th><th>Срок</th><th>Подтверждение</th></tr></thead><tbody>${a.b1.tasks.map(t=>`<tr><td>${nl(t.role)}</td><td>${nl(t.result)}</td><td>${nl(t.deadline)}</td><td>${nl(t.proof)}</td></tr>`).join('')}</tbody></table></div>${box('План контроля',a.b1.plan)}</section><section class="section"><h2>5. Блок 2: ответы</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Ответ кандидата</th><th>Обоснование</th><th>Ключ</th></tr></thead><tbody>${ROWS.map(r=>`<tr><td class="rowid">${r.id}</td><td>${sl(a.b2[r.id].status)}</td><td>${nl(a.b2[r.id].reason)}</td><td>${sl(K[r.id][0])}</td></tr>`).join('')}</tbody></table></div></section><section class="section"><h2>6. Блок 3</h2>${box('Повторяемость и системность',a.b3.rep)}${box('Управленческие выводы',a.b3.con)}${box('Меры и проверка эффекта',a.b3.mea)}</section><section class="section"><h2>7. Блок 4</h2>${box('Первые 60 минут',a.b4.first)}${box('До конца рабочего дня',a.b4.day)}${box('Критерии приоритета',a.b4.cri)}${box('Коммуникация с руководителем',a.b4.mgr)}${box('Эскалация',a.b4.esc)}</section></article>`;document.getElementById('new').onclick=()=>{if(confirm('Удалить текущее прохождение и начать тест для следующего кандидата?')){sessionStorage.removeItem(KEY);s=fresh();route()}};document.getElementById('copy').onclick=async()=>{let text=document.getElementById('report').innerText;try{await navigator.clipboard.writeText(text);show('Отчёт скопирован.')}catch{show('Не удалось скопировать автоматически.')}};document.getElementById('pdf').onclick=()=>{let el=document.getElementById('report');if(typeof html2pdf!=='function'){window.print();return}html2pdf().set({margin:[7,7,7,7],filename:'HR_result_operational_control.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:1.4,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).save()}}
